[package]
name = "my-world"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.20"
bevy_egui = "0.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# `cargo run --features dev` links Bevy dynamically for much faster rebuilds.
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

# Bevy is slow unoptimised; optimise dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
