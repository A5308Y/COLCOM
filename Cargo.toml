[package]
name = "colcom"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.20", features = ["wav", "mp3"] }
bevy_egui = "0.43"
serde = { version = "1", features = ["derive"] }
# Preserve floating-point state exactly across save/load and continuation.
serde_json = { version = "1", features = ["float_roundtrip"] }
ron = "0.12"
# PNG output for the screenshot mode (already in the tree through Bevy).
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# `cargo run --features dev` links Bevy dynamically for much faster rebuilds.
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

# Bevy is slow unoptimised; optimise dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
